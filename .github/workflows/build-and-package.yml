name: Build project

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential unzip

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow wave

    - name: Bootstrap CrossZGB tools and GBDK
      run: ./scripts/bootstrap.sh

    - name: Build project
      run: ./build.sh
      env:
        BUILD_TYPE: Release

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: project-ROM-files
        path: bin/
